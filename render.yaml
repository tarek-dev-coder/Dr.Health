services:
  - type: web
    name: drhealth
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GUEST_SESSION_SECRET
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: ENFORCE_HTTPS
        value: "true"
      - key: GUEST_API_URL
        value: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions
      - key: GUEST_MODEL
        value: Meta-Llama-3_3-70B-Instruct
      - key: GUEST_DAILY_LIMIT
        value: "5"
      - key: GUEST_IP_DAILY_LIMIT
        value: "10"
      - key: GUEST_GLOBAL_DAILY_LIMIT
        value: "200"
