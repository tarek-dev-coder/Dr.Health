services:
  - type: web
    name: drhealth
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_HOSTS
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: ENFORCE_HTTPS
        value: "true"
      - key: OVH_BASE_URL
        value: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
      - key: OVH_MODEL
        value: Meta-Llama-3_3-70B-Instruct
      - key: OVH_API_KEY
        value: empty-if-anonymous
      - key: LLM7_BASE_URL
        value: https://api.llm7.io/v1
      - key: LLM7_MODEL
        value: codestral-latest
      - key: LLM7_API_KEY
        value: unused
      - key: CHAT_RATE_LIMIT
        value: "30"
      - key: CHAT_MAX_CONCURRENT
        value: "3"
      - key: GLOBAL_RATE_LIMIT
        value: "300"
