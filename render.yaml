services:
  - type: web
    name: drhealth
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: OPENROUTER_CALLBACK_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: KEY_ENCRYPTION_SECRET
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: ENFORCE_HTTPS
        value: "true"
